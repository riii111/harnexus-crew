name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  native:
    name: native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    env:
      DO_NOT_TRACK: "1"
    defaults:
      run:
        shell: nix develop --no-write-lock-file --command bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@d9186cbdca7adedf113a159fa91f725a27866771 # v31
      - name: Lint workflows
        run: actionlint
      - name: Check Nix formatting
        run: nix fmt --no-write-lock-file -- --check flake.nix
      - name: Check formatting
        run: moon fmt --check
      - name: Check warnings
        run: moon check --deny-warn
      - name: Check C
        run: scripts/check-c.sh
      - name: Check public interfaces
        run: |
          moon info
          git add --intent-to-add --all -- '*.mbti'
          git diff --exit-code -- '*.mbti'
      - name: Test
        run: moon test
      - name: Test with sanitizers
        if: runner.os == 'Linux'
        run: scripts/test-sanitized.sh
      - name: Build native release
        run: moon build --target native --release
      - name: Run the acceptance tests
        run: python3 -m unittest discover -s test -v
