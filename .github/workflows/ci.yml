name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  native:
    name: native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    env:
      DO_NOT_TRACK: "1"
    defaults:
      run:
        shell: nix develop --no-write-lock-file --command bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
        with:
          nix_conf: |
            keep-env-derivations = true
            keep-outputs = true
      # Fetching the pinned toolchain takes most of the macOS job, so the Nix store is kept between runs for each flake.lock.
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
      # The workflow and flake.nix read the same on every OS, so they are checked once.
      - name: Lint workflows
        if: runner.os == 'Linux'
        run: actionlint
      - name: Check Nix formatting
        if: runner.os == 'Linux'
        run: nix fmt --no-write-lock-file -- --check flake.nix
      - name: Check formatting
        run: moon fmt --check
      - name: Check warnings
        run: moon check --deny-warn
      - name: Check C
        run: scripts/check-c.sh
      - name: Check public interfaces
        run: |
          moon info
          git add --intent-to-add --all -- '*.mbti'
          git diff --exit-code -- '*.mbti'
      - name: Test
        run: moon test
      - name: Test with sanitizers
        if: runner.os == 'Linux'
        run: scripts/test-sanitized.sh
      - name: Build native release
        run: moon build --target native --release
      - name: Run the acceptance tests
        run: python3 test/parallel.py -v
